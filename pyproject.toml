[project]
name = "layered-scoring"
version = "0.1.0"
description = "Katmanlı çok modelli puanlama çerçevesi (layered multi-LLM scoring framework) — açık uçlu sınav yanıtları için araştırma aracı"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "openpyxl>=3.1",
    "cryptography>=42",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
    "openai>=1.40",
    "anthropic>=0.40",
    "google-genai>=1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
spelling = ["spylls>=0.1.7"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
scoring = "scoring.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
