# VARSAYILAN PANEL — TEK SANAL SUNUCU, 64 ÇEKİRDEK, YALNIZCA CPU, TAMAMEN YEREL VE AÇIK AĞIRLIKLI
# Öğrenci yanıtları sunucudan dışarı ÇIKMAZ; API ve GPU gerekmez. Puanlama aynı sunucuda çalıştırılır ve model
# sunucuları yalnızca 127.0.0.1'e bağlanır.
#
# Çalışma düzeni (scripts/cpu64/run_study.sh tümünü sırayla yürütür):
#   Aşama A (Katman 1–2): üç puanlayıcı AYNI ANDA, üç ayrı llama-server sürecinde; fiziksel çekirdekler model
#                         boyutuna göre paylaştırılır (Qwen %40, Gemma %35, Llama %25).
#   Aşama B (Katman 3)  : puanlayıcılar kapatılır, birleştirici (Aya) TÜM çekirdeklerle açılır.
# Sunucuları başlatma: scripts/cpu64/start_scorers.sh  ve  scripts/cpu64/start_aggregator.sh
# Kurulum ve süre planı: docs/cpu64_tek_sunucu.md
#
# Model adları llama-server'a `--alias` ile verilen adlardır. model_revision = GGUF dosyasının SHA-256 özeti
# (scripts/cpu_models.tsv ile aynı; indirme betikleri doğrular). Dört model dört farklı aileden gelir.

scorers: [qwen, gemma, llama]
aggregator: aya

models:
  qwen:
    provider: openai_compat
    model: qwen2.5:14b-instruct-q4_K_M
    family: Alibaba Qwen
    open_weights: true
    model_revision: "sha256:e47ad95dad6ff848b431053b375adb5d39321290ea2c638682577dafca87c008"
    quantization: GGUF Q4_K_M
    served_by: "llama-server, 64 çekirdekli VM (Aşama A: çekirdeklerin %40'ı)"
    base_url_env: QWEN_URL          # http://127.0.0.1:8001/v1
    timeout_s: 3600
    params: {temperature: 0, seed: 20261112, max_tokens: 1000, json_schema: true}
    max_concurrency: 3              # = llama-server --parallel
  gemma:
    provider: openai_compat
    model: gemma3:12b
    family: Google Gemma
    open_weights: true
    model_revision: "sha256:fc57f67efa46d711c346e587cbef7d049e95f3df8db2eb2271153343ef0acc7b"
    quantization: GGUF Q4_K_M
    served_by: "llama-server, 64 çekirdekli VM (Aşama A: çekirdeklerin %35'i)"
    base_url_env: GEMMA_URL         # http://127.0.0.1:8002/v1
    timeout_s: 3600
    params: {temperature: 0, seed: 20261112, max_tokens: 1000, json_schema: true}
    max_concurrency: 3
  llama:
    provider: openai_compat
    model: llama3.1:8b-instruct-q4_K_M
    family: Meta Llama
    open_weights: true
    model_revision: "sha256:7b064f5842bf9532c91456deda288a1b672397a54fa729aa665952863033557c"
    quantization: GGUF Q4_K_M
    served_by: "llama-server, 64 çekirdekli VM (Aşama A: çekirdeklerin %25'i)"
    base_url_env: LLAMA_URL         # http://127.0.0.1:8003/v1
    timeout_s: 3600
    params: {temperature: 0, seed: 20261112, max_tokens: 1000, json_schema: true}
    max_concurrency: 2
  aya:
    provider: openai_compat
    model: aya-expanse:8b           # Cohere; Türkçe dahil 23 dil; CC-BY-NC (araştırma için uygun)
    family: Cohere Aya
    open_weights: true
    model_revision: "sha256:9592bad943fe56cf93200286a0a4b00a158cd84a408f227b9978ec5879002fb8"
    quantization: GGUF Q4_K_M
    served_by: "llama-server, 64 çekirdekli VM (Aşama B: tüm çekirdekler)"
    base_url_env: AYA_URL           # http://127.0.0.1:8004/v1
    timeout_s: 3600
    params: {temperature: 0, seed: 20261112, max_tokens: 1000, json_schema: true}
    max_concurrency: 4

retry:
  max_validation_retries: 2
  max_api_retries: 4
  backoff_initial_seconds: 10
  backoff_max_seconds: 120
