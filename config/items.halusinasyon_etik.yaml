# GERÇEK ÇALIŞMA SORULARI — Halüsinasyon ve Etik (2 KISA açık uçlu soru, çevrim içi sınav için)
# İnsan değerlendiriciler için kodlama kılavuzu: docs/puanlama_kilavuzu_halusinasyon_etik.md
#
# Kullanım: config/experiment.yaml > items_file: config/items.halusinasyon_etik.yaml
# Moodle'da soru sırası: 1 = S1 (halüsinasyon), 2 = S2 (etik)  -> config/moodle_columns.yaml > item_map
#
# Puanlama: analitik; her soruda 2 ölçüt × 0–4 puan = soru başına 0–8.
# Beklenen yanıt: 80–150 kelime, soru başına ~7–8 dakika.
#
# ÇAPA YANITLAR: Aşağıdaki çapalar araştırmacı tarafından yazılmış ÖRNEK yanıtlardır. Pilot uygulamadan sonra,
# altın sete GİRMEYECEK gerçek pilot yanıtlarla desteklenmeleri önerilir (source_response_id doldurulur;
# check-leakage altın setle çakışmayı denetler).

defaults:
  score_min: 0
  score_max: 4

items:
  # ===================================================================================== S1 HALÜSİNASYON
  - item_id: S1
    bloom: alt
    bloom_level: anlama
    question: >-
      Büyük dil modellerinde "halüsinasyon" nedir ve neden ortaya çıkar? Bir örnekle açıklayınız.
    reference_answer: >-
      Halüsinasyon, bir dil modelinin gerçeğe aykırı ya da tamamen uydurma bir bilgiyi akıcı ve kendinden emin bir
      dille, sanki doğruymuş gibi üretmesidir. Model bunu bilerek yapmaz; ancak cevap ikna edici olduğu için hata
      kolay fark edilmez. Örneğin ödev için kaynak istendiğinde, yazar adı ve yılıyla birlikte gerçekte var
      olmayan bir makale uydurabilir. Bunun temel nedeni, modelin bilgiyi bir veri tabanından aramaması; eğitim
      verisindeki örüntülere dayanarak bir sonraki kelimeyi olasılıksal olarak tahmin etmesidir. Bu süreç dilsel
      olarak tutarlı bir metin üretir, ama doğruluğunu denetlemez. Eğitim verisindeki eksik, hatalı ya da eski
      bilgiler ve modelin "bilmiyorum" demek yerine tahmin yürütmeye eğilimli olması da halüsinasyona yol açar.
    criteria:
      - criterion_id: C1
        name: Tanım ve örnek
        description: >-
          Halüsinasyonun doğru tanımı (gerçeğe aykırı, doğrulanamayan ya da uydurma bilginin üretilmesi) ve uygun,
          somut bir örnek. En üst düzey, ayırt edici özelliğin (akıcı ve kendinden emin sunum ya da kasıtlı yalan
          olmaması) kavranmasını gerektirir.
        levels:
          0: Tanım yok, tamamen yanlış (ör. çökme, virüs, yavaşlama, görüntü bozulması) ya da soruyla ilgisiz.
          1: Çok genel ya da eksik tanım ("yanlış cevap vermesi", "hata yapması"); uydurma bilgi fikri yok. Örnek yok ya da örnek halüsinasyon değil.
          2: Temel tanım doğru (gerçeğe aykırı ya da uydurma bilgi üretme), ama örnek yok ya da çok genel. Ya da uygun somut örnek var, ama tanım belirsiz.
          3: Doğru tanım ve somut, uygun bir örnek (ör. var olmayan kaynak, yanlış tarih ya da istatistik, olmayan yasa maddesi).
          4: Doğru tanım ve somut örnek; ek olarak bilginin akıcı ve kendinden emin biçimde, doğruymuş gibi sunulduğu ya da bunun kasıtlı bir yalan olmadığı açıkça belirtilmiş.
      - criterion_id: C2
        name: Nedenler
        description: >-
          Halüsinasyonun nedenlerinin doğru açıklanması. Kabul edilen nedenler: (a) olasılıksal kelime tahmini /
          doğruluk denetiminin olmaması, (b) eğitim verisindeki eksik, hatalı ya da güncel olmayan bilgi,
          (c) eğitimin akıcı cevabı ödüllendirmesi ve "bilmiyorum" demede zayıflık, (d) belirsiz ya da yanlış
          öncüllü sorular, (e) veride az temsil edilen ya da uzmanlık gerektiren konular.
        levels:
          0: Neden yok ya da tamamen yanlış (ör. internet kesintisi, virüs, "bilerek yalan söylemek için tasarlanmıştır", "bilgisayar yorulur").
          1: Belirsiz ya da yüzeysel ("yapay zekâ mükemmel değildir", "hata yapabilir"); kabul edilen nedenlerden hiçbiri yok.
          2: Kabul edilen nedenlerden yalnızca biri adlandırılmış, açıklanmamış (ör. "eğitim verisi yanlış olabilir").
          3: Kabul edilen nedenlerden en az ikisi adlandırılmış ya da biri mekanizmasıyla (bu sonucu neden doğurduğu) açıklanmış.
          4: En az iki neden ve en az biri mekanizmasıyla doğru açıklanmış; olasılıksal üretimin doğruluk garantisi vermediği anlaşılmış.
    anchors:
      - anchor_id: S1-A0
        source: araştırmacı-örnek
        source_response_id: null
        scores: {C1: 0, C2: 0}
        text: >-
          Halüsinasyon yapay zekânın aşırı yüklenip çökmesidir. Bilgisayar çok ısınınca ortaya çıkar.
      - anchor_id: S1-A1
        source: araştırmacı-örnek
        source_response_id: null
        scores: {C1: 1, C2: 1}
        text: >-
          Halüsinasyon, modelin bazen yanlış cevap vermesidir. Çünkü yapay zekâ da mükemmel değildir, hata
          yapabilir.
      - anchor_id: S1-A2
        source: araştırmacı-örnek
        source_response_id: null
        scores: {C1: 2, C2: 2}
        text: >-
          Halüsinasyon, modelin gerçekte olmayan, uydurma bilgiler üretmesidir. Bunun nedeni eğitildiği verilerde
          yanlış bilgiler olmasıdır.
      - anchor_id: S1-A3
        source: araştırmacı-örnek
        source_response_id: null
        scores: {C1: 3, C2: 3}
        text: >-
          Halüsinasyon, dil modelinin doğru olmayan ya da uydurma bilgiyi cevap olarak vermesidir. Örneğin ödev için
          kaynak istediğimde bana gerçekte olmayan bir kitap adı ve yazarı verebilir. Bunun nedeni modelin
          kelimeleri olasılığa göre üretmesi ve eğitim verisinin eski ya da eksik olabilmesidir.
      - anchor_id: S1-A4
        source: araştırmacı-örnek
        source_response_id: null
        scores: {C1: 4, C2: 4}
        text: >-
          Halüsinasyon, modelin gerçeğe aykırı ya da tamamen uydurma bir bilgiyi çok akıcı ve emin bir dille,
          sanki doğruymuş gibi sunmasıdır; model yalan söylemeye çalışmaz ama sonuç ikna edici olduğu için hata
          kolay fark edilmez. Örneğin bir avukata var olmayan mahkeme kararlarını numaralarıyla sıralayabilir.
          Nedeni, modelin bilgi aramayıp eğitim verisindeki kalıplara göre en olası sonraki kelimeyi üretmesidir:
          dilsel olarak tutarlı olan şey her zaman doğru değildir ve içeride bir doğruluk kontrolü yoktur. Eğitimin
          akıcı cevapları ödüllendirmesi de modeli "bilmiyorum" demek yerine tahmin etmeye iter.
      - anchor_id: S1-K1
        source: araştırmacı-örnek (karma profil)
        source_response_id: null
        scores: {C1: 4, C2: 1}
        text: >-
          Halüsinasyon, modelin hiç var olmayan bir bilgiyi büyük bir özgüvenle, gerçekmiş gibi anlatmasıdır; bunu
          kandırmak için yapmaz ama okuyan kişi inanabilir. Mesela bana olmayan bir yasa maddesini numarasıyla
          birlikte anlattı. Neden böyle olduğunu tam bilmiyorum, sanırım teknoloji henüz gelişmedi.
      - anchor_id: S1-K2
        source: araştırmacı-örnek (karma profil)
        source_response_id: null
        scores: {C1: 1, C2: 4}
        text: >-
          Halüsinasyon modelin hatalı çalışmasıdır. Model bilgiyi bir yerden aramaz; eğitim verisindeki kalıplara
          bakarak en olası sonraki kelimeyi seçer. Bu yüzden kulağa doğru gelen ama gerçekte yanlış cümleler
          kurabilir, çünkü söylediğinin doğru olup olmadığını kontrol eden bir mekanizması yoktur. Eğitim verisi
          güncel değilse bu daha da artar.

  # ===================================================================================== S2 ETİK
  - item_id: S2
    bloom: üst
    bloom_level: değerlendirme
    question: >-
      Bir şirket, geçmiş çalışan verileriyle eğitilmiş bir yapay zekâyla iş başvurularını puanlıyor ve düşük
      puanlı adayları insan incelemesi olmadan eliyor. Etik sorunları açıklayıp şirkete gerekçeli bir öneride
      bulununuz.
    reference_answer: >-
      En önemli sorun yanlılıktır. Sistem geçmiş işe alım verisiyle eğitildiği için geçmişte hangi gruplar
      daha çok işe alındıysa onları "iyi aday" olarak öğrenir ve benzemeyenleri düşük puanlar. Cinsiyet doğrudan
      kullanılmasa bile okul ya da adres gibi vekil bilgiler üzerinden ayrımcılık sürebilir; eski eşitsizlik
      otomatikleşir. İkinci sorun, kararların insan denetimi olmadan verilmesi ve açıklanamamasıdır: aday neden
      elendiğini bilemez, itiraz edemez ve hata olduğunda sorumlu belirsizdir. Önerim, sistemin yalnızca İK
      uzmanını destekleyen bir araç olarak kullanılması ve hiçbir adayın insan incelemesi olmadan elenmemesidir.
      Ayrıca cinsiyet ve yaş gibi gruplara göre seçilme oranları düzenli olarak denetlenmeli, adaylara yapay zekâ
      kullanıldığı bildirilip itiraz yolu açılmalıdır. Denetimde gruplar arasında anlamlı fark çıkarsa sistem
      durdurulmalıdır.
    criteria:
      - criterion_id: C1
        name: Etik sorunlar ve açıklaması
        description: >-
          Kabul edilen etik sorunlar: (a) yanlılık/ayrımcılık (geçmiş veriden öğrenme, vekil değişkenler),
          (b) şeffaflık/açıklanabilirlik, (c) hesap verebilirlik/itiraz hakkı, (d) insan denetiminin yokluğu
          (tam otomatik karar), (e) gizlilik/kişisel verilerin korunması, (f) doğruluk ya da geçerlik ("geçmişte
          işe alınan = iyi aday" varsayımı). "Adlandırma": kavramın özünü doğru söylemek; "açıklama": bu
          senaryoda neden sorun olduğunu en az bir cümleyle kurmak.
        levels:
          0: Etik sorun yok ya da yalnızca teknik veya maliyet konuları (ör. "sistem pahalıdır", "hızlı çalışır").
          1: Belirsiz tek bir endişe ("haksızlık olabilir", "yapay zekâ hata yapar"); etik bir kavram adlandırılmamış.
          2: Bir etik sorun adlandırılmış ama açıklanmamış, ya da birden çok sorun yalnızca liste hâlinde sayılmış.
          3: En az bir etik sorun bu senaryoya bağlanarak açıklanmış; birden çok sorun adlandırılmış olabilir.
          4: En az iki farklı etik sorun açıklanmış ve yanlılığın bu senaryodaki mekanizması (geçmiş işe alım verisinden öğrenip eşitsizliği yeniden üretme ya da vekil değişkenler) doğru açıklanmış.
      - criterion_id: C2
        name: Gerekçeli öneri
        description: >-
          Kararın yönü (sürdürme ya da durdurma) değil gerekçe kalitesi puanlanır. Kabul edilen somut önlemler:
          insan denetimi (destek aracı, düşük puanlıların insan tarafından incelenmesi), yanlılık denetimi
          (gruplara göre seçilme oranları), vekil değişkenlerin çıkarılması ya da dengeli veri, şeffaflık
          (YZ kullanımının bildirilmesi, gerekçe, itiraz hakkı), KVKK uyumu, pilot uygulama ve izleme.
        levels:
          0: Öneri yok.
          1: Gerekçesiz kesin yargı ("kesinlikle kullanılmalı", "yasaklanmalı").
          2: Öneri var ama belirsiz ya da gerekçesi zayıf ("dikkatli kullanılmalı", "kontrol edilmeli").
          3: En az bir somut önlem, gerekçesiyle (hangi sorunu çözdüğü belli).
          4: En az iki somut önlem, belirtilen sorunlarla açıkça eşleşmiş ve gerekçelendirilmiş; ek olarak koşullu karar (hangi durumda sürdürülmeli ya da durdurulmalı) ya da önlemin nasıl izleneceği belirtilmiş.
    anchors:
      - anchor_id: S2-A0
        source: araştırmacı-örnek
        source_response_id: null
        scores: {C1: 0, C2: 0}
        text: >-
          Yapay zekâ çok hızlı çalıştığı için şirketin işini kolaylaştırır. Kurulumu biraz pahalı olabilir ama
          zamanla kendini amorti eder.
      - anchor_id: S2-A1
        source: araştırmacı-örnek
        source_response_id: null
        scores: {C1: 1, C2: 1}
        text: >-
          Bu uygulama bazı insanlara haksızlık olabilir çünkü yapay zekâ hata yapar. Bence şirket bu sistemi
          kesinlikle kullanmamalı.
      - anchor_id: S2-A2
        source: araştırmacı-örnek
        source_response_id: null
        scores: {C1: 2, C2: 2}
        text: >-
          Sistem yanlı olabilir, ayrıca şeffaflık ve gizlilik sorunları da vardır. Şirket sistemi dikkatli kullanmalı
          ve sonuçları kontrol etmelidir.
      - anchor_id: S2-A3
        source: araştırmacı-örnek
        source_response_id: null
        scores: {C1: 3, C2: 3}
        text: >-
          Sistem geçmişte işe alınanlara benzeyen adayları tercih edeceği için farklı geçmişten gelen nitelikli
          adaylar haksız yere elenebilir; bu bir yanlılık sorunudur. Şeffaflık da bir sorundur. Şirket, düşük puan
          alan başvuruları bir İK uzmanına inceletmelidir; böylece sistemin hatalı elediği adaylar kaybedilmez.
      - anchor_id: S2-A4
        source: araştırmacı-örnek
        source_response_id: null
        scores: {C1: 4, C2: 4}
        text: >-
          Sistem geçmiş işe alım verisinden "iyi aday" profilini öğrendiği için geçmişte hangi gruplar daha çok işe
          alındıysa onları kayırır; cinsiyet kullanılmasa bile okul ya da adres gibi bilgiler üzerinden ayrımcılık
          sürer, yani eski eşitsizlik otomatikleşir. Ayrıca kararı hiçbir insan denetlemediği için aday neden
          elendiğini öğrenemez, itiraz edemez ve hatada sorumlu belirsizdir. Önerim: sistem yalnızca İK uzmanına
          öneri versin, hiçbir aday insan incelemesi olmadan elenmesin; yanlılığa karşı da gruplara göre seçilme
          oranları her üç ayda bir raporlansın ve anlamlı fark çıkarsa sistem durdurulsun.
      - anchor_id: S2-K1
        source: araştırmacı-örnek (karma profil)
        source_response_id: null
        scores: {C1: 4, C2: 1}
        text: >-
          Sistem geçmiş işe alımlardan öğrendiği için o dönemde az işe alınan kadınları ya da yaşlıları düşük
          puanlar; bu doğrudan cinsiyet sorulmasa bile mezun olunan okul ya da üye olunan kulüp gibi bilgilerle
          olur ve geçmişteki ayrımcılığı tekrarlar. Bunun yanında adayların verileri izinleri alınmadan bir
          algoritmaya verildiği için gizlilik ihlali de vardır. Bence şirket bu sistemi hemen bırakmalı.
      - anchor_id: S2-K2
        source: araştırmacı-örnek (karma profil)
        source_response_id: null
        scores: {C1: 1, C2: 4}
        text: >-
          Bu sistem bazı adaylara haksızlık yapabilir. Şirket sistemi yalnızca ön sıralama için kullanmalı ve
          düşük puanlı tüm başvuruları bir İK uzmanına inceletmeli; böylece yanlış elenen adaylar kurtarılır.
          Ayrıca kadın ve erkek, genç ve yaşlı adayların seçilme oranları her ay karşılaştırılmalı; aralarında
          büyük fark çıkarsa sistem durdurulup yeniden eğitilmelidir.
