# 3 CPU SUNUCULU panel (40 + 28 + 20 çekirdek). Varsayılan: config/models.yaml (tek 64 çekirdekli sanal sunucu).
# Öğrenci yanıtları kurum sunucularından dışarı ÇIKMAZ; API ve GPU gerekmez.
#
# Sunucu dağılımı (her puanlayıcı ayrı makinede -> üç model AYNI ANDA puanlar):
#   40 çekirdekli sunucu : qwen  (en büyük model, 14B)  + aya (birleştirici; yalnızca Katman 3'te, puanlayıcılar bittikten sonra)
#   28 çekirdekli sunucu : gemma (12B)
#   20 çekirdekli sunucu : llama (8B)
# Adresler .env içinden okunur:  QWEN_URL / GEMMA_URL / LLAMA_URL / AYA_URL = http://<sunucu>:<port>/v1
# Sunucu yazılımı: llama.cpp `llama-server` (önerilen: iş parçacığı/NUMA/önek önbelleği denetimi) ya da Ollama.
# Kurulum, hız ölçümü (`scoring benchmark`) ve süre planı: docs/cpu_sunucu_kurulumu.md
#
# Model adları Ollama etiketleridir; llama-server kullanılıyorsa aynı adı `--alias` ile verin.
# Tekrar üretilebilirlik: model_revision alanına GGUF dosyasının SHA-256 özetini (llama.cpp) ya da
# `ollama show <model> --modelfile` özetini yazın; her çağrı kaydına `model_meta` olarak girer.
# json_schema: true -> sunucu çıktıyı rubrikten üretilen JSON şemasıyla kısıtlar (geçersiz çıktı/yeniden deneme olmaz).
# Dört model dört farklı aileden gelir (Alibaba, Google, Meta, Cohere).

scorers: [qwen, gemma, llama]
aggregator: aya

models:
  qwen:
    provider: openai_compat
    model: qwen2.5:14b-instruct-q4_K_M
    family: Alibaba Qwen
    open_weights: true
    model_revision: "sha256:e47ad95dad6ff848b431053b375adb5d39321290ea2c638682577dafca87c008"   # GGUF (llama.cpp); Ollama ile çalışırken digest yazın
    quantization: GGUF Q4_K_M
    served_by: "CPU (40 çekirdek)"
    base_url_env: QWEN_URL
    timeout_s: 1800
    params: {temperature: 0, seed: 20261112, max_tokens: 1000, json_schema: true}
    max_concurrency: 4            # sunucudaki paralel yuva sayısıyla aynı olmalı (llama-server --parallel)
  gemma:
    provider: openai_compat
    model: gemma3:12b
    family: Google Gemma
    open_weights: true
    model_revision: "sha256:fc57f67efa46d711c346e587cbef7d049e95f3df8db2eb2271153343ef0acc7b"   # GGUF (llama.cpp); Ollama ile çalışırken digest yazın
    quantization: GGUF Q4_K_M
    served_by: "CPU (28 çekirdek)"
    base_url_env: GEMMA_URL
    timeout_s: 1800
    params: {temperature: 0, seed: 20261112, max_tokens: 1000, json_schema: true}
    max_concurrency: 3
  llama:
    provider: openai_compat
    model: llama3.1:8b-instruct-q4_K_M
    family: Meta Llama
    open_weights: true
    model_revision: "sha256:7b064f5842bf9532c91456deda288a1b672397a54fa729aa665952863033557c"   # GGUF (llama.cpp); Ollama ile çalışırken digest yazın
    quantization: GGUF Q4_K_M
    served_by: "CPU (20 çekirdek)"
    base_url_env: LLAMA_URL
    timeout_s: 1800
    params: {temperature: 0, seed: 20261112, max_tokens: 1000, json_schema: true}
    max_concurrency: 2
  aya:
    provider: openai_compat
    model: aya-expanse:8b         # Cohere; Türkçe dahil 23 dil; CC-BY-NC (araştırma için uygun)
    family: Cohere Aya
    open_weights: true
    model_revision: "sha256:9592bad943fe56cf93200286a0a4b00a158cd84a408f227b9978ec5879002fb8"   # GGUF (llama.cpp); Ollama ile çalışırken digest yazın
    quantization: GGUF Q4_K_M
    served_by: "CPU (40 çekirdek)"
    base_url_env: AYA_URL
    timeout_s: 1800
    params: {temperature: 0, seed: 20261112, max_tokens: 1000, json_schema: true}
    max_concurrency: 4

retry:
  max_validation_retries: 2
  max_api_retries: 4
  backoff_initial_seconds: 10
  backoff_max_seconds: 120
